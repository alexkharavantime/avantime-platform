name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
      MFA_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      MFA_ENCRYPTION_KEY_VERSION: ci-v1
      AUTH_PUBLIC_ORIGIN: https://ci.example.invalid
      AUTH_ADMIN_MFA_REQUIRED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck -- --force
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  identity-security:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run test:identity
      - run: npm run test:permissions -w @avantime/web
      - run: npm run test:governance-validation -w @avantime/web
      - run: npm run security:identity-scan -w @avantime/web
      - run: npm run security:forbidden-credential-scan -w @avantime/web
      - run: npm run security:default-secret-scan -w @avantime/web
      - run: npm run security:client-tenant-scan -w @avantime/web
      - run: npm run security:permission-scan -w @avantime/web
      - run: npm run security:governance-scan -w @avantime/web
      - run: npm run security:secret-scan -w @avantime/web
      - run: npm run security:jira-scan
      - run: npm run security:jira-sync-scan
      - run: npm run identity:docs-check
      - run: npm run governance:docs-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cp .env.integration.example .env.integration
      - run: npm run integration:up
      - run: npm run db:generate
      - run: npm run documents:migration-rehearsal
      - run: npm run test:integration -- --test-name-pattern="Jira sync"
      - run: npm run test:integration
      - run: npm run test:rag-integration
      - run: npm run test:production-integration
      - run: npm run pgvector:load-test -- --integration --smoke
      - run: npm run restore:rehearsal:integration
      - if: always()
        run: npm run integration:down

  staging-baseline:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cp .env.staging.local.example .env.staging
      - run: npm run security:staging-scan
      - run: npm run staging:docs-check
      - run: docker compose --env-file .env.staging -f docker-compose.staging.yml -f docker-compose.staging.local.yml config --quiet
      - run: npm run staging:up
      - run: docker compose --env-file .env.staging -p avantime-staging -f docker-compose.staging.yml -f docker-compose.staging.local.yml exec -T knowledge-index-worker npm run staging:config-check -w @avantime/web
      - run: docker compose --env-file .env.staging -p avantime-staging -f docker-compose.staging.yml -f docker-compose.staging.local.yml exec -T knowledge-index-worker npm run staging:migration-status -w @avantime/web
      - run: npm run staging:smoke
      - run: docker compose --env-file .env.staging -p avantime-staging -f docker-compose.staging.yml -f docker-compose.staging.local.yml --profile operations run --rm backup
      - run: npm run staging:restore-rehearsal
      - if: always()
        run: npm run staging:down

  browser-accessibility:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: avantime_test
          POSTGRES_PASSWORD: avantime_test_only
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U avantime_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      BROWSER_DATABASE_URL: postgresql://avantime_test:avantime_test_only@127.0.0.1:55432/avantime_browser_integration?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-accessibility-failure
          path: |
            .artifacts/playwright-results
            .artifacts/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  ocr-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/ocr-integration.Dockerfile -t avantime-ocr-integration .
      - run: docker run --rm avantime-ocr-integration

  security-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=optional --audit-level=critical
      - run: npm run governance:dependency-report
      - run: npm run security:secret-scan -w @avantime/web
      - run: npm run security:migration-scan -w @avantime/web
      - run: npm run security:jira-scan
      - run: npm run security:jira-sync-scan
      - run: npm run backup:dry-run
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/avantime_integration
          BACKUP_ENVIRONMENT: ci
          BACKUP_OUTPUT_DIR: /tmp/avantime-ci-backups
          BACKUP_ENCRYPTION_REQUIRED: 'true'
      - run: docker build --target web -f docker/production.Dockerfile -t avantime-platform:ci .
      - run: docker build --target document-worker -f docker/production.Dockerfile -t avantime-document-worker:ci .
      - name: Scan document worker for Critical/High vulnerabilities
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          image-ref: avantime-document-worker:ci
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH
      - run: docker build --target embedding-worker -f docker/production.Dockerfile -t avantime-embedding-worker:ci .
      - run: docker build --target migration -f docker/production.Dockerfile -t avantime-migration:ci .
      - run: docker build --target operations -f docker/production.Dockerfile -t avantime-operations:ci .
      - run: docker build --target notification-worker -f docker/production.Dockerfile -t avantime-notification-worker:ci .
      - run: docker build --target jira-worker -f docker/production.Dockerfile -t avantime-jira-worker:ci .
      - run: docker build --target jira-inbound-worker -f docker/production.Dockerfile -t avantime-jira-inbound-worker:ci .
      - run: docker build --target knowledge-index-worker -f docker/production.Dockerfile -t avantime-knowledge-worker:ci .
