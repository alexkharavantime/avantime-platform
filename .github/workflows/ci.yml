name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      SESSION_SECRET: ci-only-session-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npm run staging:config-check -- --example
      - run: npm run staging:compose-check -- --example
      - run: npm run security:architecture-scan
      - run: npm run docs:links-check

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: cp .env.integration.example .env.integration
      - run: npm run integration:up
      - run: npm run db:generate
      - run: npm run documents:migration-rehearsal
      - run: npm run test:integration
      - run: npm run test:rag-integration
      - run: npm run test:production-integration
      - run: npm run pgvector:load-test -- --integration --smoke
      - run: npm run restore:rehearsal:integration
      - if: always()
        run: npm run integration:down

  ocr-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f docker/ocr-integration.Dockerfile -t avantime-ocr-integration .
      - run: docker run --rm avantime-ocr-integration

  security-and-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm audit --omit=optional --audit-level=critical
      - run: npm run security:dependency-revalidation
      - run: npm run security:secret-scan -w @avantime/web
      - run: npm run security:migration-scan -w @avantime/web
      - run: npm run security:architecture-scan -w @avantime/web
      - run: npm run backup:dry-run
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/avantime_integration
          BACKUP_ENVIRONMENT: ci
          BACKUP_OUTPUT_DIR: /tmp/avantime-ci-backups
          BACKUP_ENCRYPTION_REQUIRED: 'true'
      - run: docker build --target web -f docker/production.Dockerfile -t avantime-platform:ci .
      - run: docker build --target document-worker -f docker/production.Dockerfile -t avantime-document-worker:ci .
      - run: docker build --target embedding-worker -f docker/production.Dockerfile -t avantime-embedding-worker:ci .
      - run: docker build --target migration -f docker/production.Dockerfile -t avantime-migration:ci .
      - run: docker build --target operations -f docker/production.Dockerfile -t avantime-operations:ci .

  container-supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: docker/production.Dockerfile
            target: web
          - name: document-worker
            dockerfile: docker/production.Dockerfile
            target: document-worker
          - name: embedding-worker
            dockerfile: docker/production.Dockerfile
            target: embedding-worker
          - name: migration
            dockerfile: docker/production.Dockerfile
            target: migration
          - name: operations
            dockerfile: docker/production.Dockerfile
            target: operations
          - name: ocr-integration
            dockerfile: docker/ocr-integration.Dockerfile
            target: ''
    steps:
      - uses: actions/checkout@v4
      - name: Build production target
        if: matrix.target != ''
        run: docker build --target "${{ matrix.target }}" -f "${{ matrix.dockerfile }}" -t "avantime-${{ matrix.name }}:ci" .
      - name: Build OCR integration target
        if: matrix.target == ''
        run: docker build -f "${{ matrix.dockerfile }}" -t "avantime-${{ matrix.name }}:ci" .
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: avantime-${{ matrix.name }}:ci
          format: cyclonedx-json
          output-file: avantime-${{ matrix.name }}.cdx.json
          artifact-name: avantime-${{ matrix.name }}.cdx.json
          upload-artifact-retention: 30
          upload-release-assets: false
      - name: Scan high and critical vulnerabilities
        id: image-scan
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: avantime-${{ matrix.name }}:ci
          fail-build: true
          severity-cutoff: high
          output-format: sarif
          output-file: avantime-${{ matrix.name }}.sarif
          cache-db: true
      - name: Retain vulnerability report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: avantime-${{ matrix.name }}-vulnerability-report
          path: avantime-${{ matrix.name }}.sarif
          if-no-files-found: error
          retention-days: 30
      - name: Enforce image vulnerability gate
        if: steps.image-scan.outcome == 'failure'
        run: exit 1
