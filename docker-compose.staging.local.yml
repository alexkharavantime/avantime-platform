name: avantime-staging

services:
  migration:
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  notification-worker:
    depends_on:
      redis:
        condition: service_healthy

  knowledge-index-worker:
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - staging-postgres-data:/var/lib/postgresql/data
    networks:
      - application
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:8.4.0-alpine
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - staging-redis-data:/data
    networks:
      - application
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 2s
      timeout: 5s
      retries: 30
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - staging-minio-data:/data
    networks:
      - application
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - >
        mc alias set staging http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing "staging/$${OBJECT_STORAGE_BUCKET}";
        mc mb --ignore-existing "staging/$${BACKUP_OBJECT_STORAGE_BUCKET}";
        mc anonymous set none "staging/$${OBJECT_STORAGE_BUCKET}";
        mc anonymous set none "staging/$${BACKUP_OBJECT_STORAGE_BUCKET}";
        mc ilm rule add --expire-days "$${OBJECT_STORAGE_RETENTION_DAYS}" --prefix staging/ "staging/$${OBJECT_STORAGE_BUCKET}";
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET}
      BACKUP_OBJECT_STORAGE_BUCKET: ${BACKUP_OBJECT_STORAGE_BUCKET}
      OBJECT_STORAGE_RETENTION_DAYS: ${OBJECT_STORAGE_RETENTION_DAYS:-7}
    networks:
      - application
    restart: 'no'

  postgres-restore:
    image: pgvector/pgvector:pg16
    profiles: ['restore']
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: avantime_staging_restore_rehearsal
    networks:
      - application
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d avantime_staging_restore_rehearsal']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: 'no'

volumes:
  staging-postgres-data:
  staging-redis-data:
  staging-minio-data:
