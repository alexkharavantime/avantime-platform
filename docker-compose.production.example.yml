name: avantime-production-reference

x-runtime: &runtime
  image: avantime-platform:task-005
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=512m,mode=1770
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  networks:
    - application
  deploy:
    resources:
      limits:
        cpus: '2'
        memory: 2G
      reservations:
        cpus: '0.25'
        memory: 256M

services:
  migration:
    <<: *runtime
    image: avantime-platform-migration:task-005
    command:
      ['npx', 'prisma', 'migrate', 'deploy', '--schema', 'packages/database/prisma/schema.prisma']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - internal

  web:
    <<: *runtime
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    expose:
      - '3000'
    networks:
      - application
      - internal
      - egress
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3000/api/health/documents']
      interval: 30s
      timeout: 5s
      retries: 3

  document-worker:
    <<: *runtime
    image: avantime-platform-document-worker:task-005
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - application
      - internal

  embedding-worker:
    <<: *runtime
    image: avantime-platform-embedding-worker:task-005
    depends_on:
      migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - application
      - internal
      - egress

  reverse-proxy:
    image: caddy:2.10.0-alpine
    ports:
      - '443:443'
    read_only: true
    tmpfs:
      - /data
      - /config
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - public
      - application

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.4.0-alpine
    command: ['redis-server', '/run/secrets/redis_configuration']
    secrets:
      - redis_configuration
    volumes:
      - redis-data:/data
    networks:
      - internal
      - application
    healthcheck:
      test: ['CMD', 'redis-cli', '--tls', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  object-storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_root_password
    secrets:
      - minio_root_user
      - minio_root_password
    volumes:
      - object-data:/data
    networks:
      - internal
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10

  backup:
    <<: *runtime
    image: avantime-platform-operations:task-005
    command: ['npm', 'run', 'backup:create', '--', '--execute']
    environment:
      BACKUP_OUTPUT_DIR: /var/lib/avantime-backups
    volumes:
      - backup-data:/var/lib/avantime-backups
    restart: 'no'
    networks:
      - internal

networks:
  public:
  application:
    internal: true
  internal:
    internal: true
  egress:

volumes:
  postgres-data:
  redis-data:
  object-data:
  backup-data:

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  redis_configuration:
    file: ./secrets/redis.conf
  minio_root_user:
    file: ./secrets/minio_root_user
  minio_root_password:
    file: ./secrets/minio_root_password
